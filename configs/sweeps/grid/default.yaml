# Cartesian sweep (full permutations).
# Usage:
#   python3 scripts/sweep.py --config configs/sweeps/cartesian/default.yaml

task_train: Isaac-Racing-Quadcopter-Manager-Fixed-v0
task_play: Isaac-Racing-Quadcopter-Manager-Fixed-Play-v0

sweep_mode: grid

train_iterations: 417
eval_steps: 3000
num_envs: 8192

extra_train_args:
  - --headless

extra_play_args:
  - --headless

param_grid:
  recovery_spawn_prob:
    - 0.2
  curriculum_stage1_steps:
    - 10000
  curriculum_stage2_steps:
    - 10000
  episode_length_s:
    - 30.0

  randomize_velocity_limit:
    - true
  velocity_limit_range:
    - "(8.0, 15.0)"

  observation_noise.enable:
    - true
  observation_noise.gaussian_std_base_lin_vel:
    - 0.015
  observation_noise.gaussian_std_base_ang_vel:
    - 0.015
  observation_noise.gaussian_std_obs_gates:
    - 0.02
  observation_noise.bias_range_obs_gates:
    - "(-0.08, 0.08)"
  observation_noise.dropout_prob:
    - 0.0

  action_noise.enable:
    - true
  action_noise.gaussian_std:
    - 0.02
  action_noise.bias_range:
    - "(-0.03, 0.03)"
  action_noise.lpf_alpha:
    - 0.85

  rewards.gate_progress.weight:
    - 20.0
  DIRECT_VELOCITY_TOWARD_GATE:
    - 0.1
