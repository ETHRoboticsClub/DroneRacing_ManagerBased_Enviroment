# DO NOT TOUCH THIS FILE
# This config is used for regression testing
# Required scores: Lap% >= 98% and Lap Time <= 11s

task_train: Isaac-Racing-Quadcopter-Manager-Fixed-v0
task_play:  Isaac-Racing-Quadcopter-Manager-Fixed-Play-v0

extra_train_args: ["--headless"]
extra_play_args:  ["--headless"]

env_vars:
  DRONE_MODEL: "crazyflie"
  ACTION_TYPE: "rates"

sweep_mode: sequential

num_envs: 8192

train_iterations: 834  # 20016 steps
eval_steps: 3000

# rotation: [roll, pitch, yaw] in degrees (ROS/URDF RPY order).
# yaw is CW-from-+Y: 0 -> drone passes in +Y, 90 -> +X.
gate_track:
  - # 0 — low start, heading north
    position: [7.5, 2.0, 1.2]
    rotation: [0, 0, 0]

  - # 1-3 — climbing right sweep toward the top of the tile
    position: [12.5, 4.5, 2.5]
    rotation: [90, 0, 65]

  - position: [13.5, 9.0, 4.5]
    rotation: [0, 0, 105]

  - position: [10.5, 13.0, 4.5]
    rotation: [0, 0, 160]

  - # 4-5 — SPLIT-S
    # Gate 4: enter heading south at 4.2 m altitude.
    # Drone rolls inverted, dives, and exits gate 5 heading north at 1.5 m
    # (2.7 m altitude drop, ~1.5 m forward — extremely tight).
    position: [7.5, 13.5, 4.2]
    rotation: [0, 0, 180]  # entry

  - position: [7.5, 12.0, 1.5]
    rotation: [0, 0, 0]  # exit

  - # 6-7 — left-side swoop
    position: [4.0, 10.5, 2.0]
    rotation: [0, 0, 270]

  - position: [1.8, 7.5, 1.5]
    rotation: [0, 0, 230]

  - # 8-9 — CHICANE (offset gates, tight lateral snap)
    position: [3.5, 3.5, 1.8]
    rotation: [0, 0, 350]

  - position: [5.5, 2.0, 2.5]
    rotation: [0, 0, 25]

param_grid:
  curriculum_stage1_steps:
    - 7500
  curriculum_stage2_steps:
    - 10000
  #observation_noise.enable:
  #  - false
  action_noise.enable:
    - false
  DIRECT_VELOCITY_TOWARD_GATE:
    - 2.0
