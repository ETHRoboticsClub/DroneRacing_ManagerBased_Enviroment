# STALE (runs, but is NOT SITL parity any more): written when hovering defaulted to the
# anemos_sitl profile + Betaflight SITL action. Hovering now trains anemos_urdf with the direct
# rates action, so this is a plain hovering run at 8192 envs / 10000 iterations.

task_train: Isaac-Hovering-Quadcopter-Manager-v0
task_play:  Isaac-Hovering-Quadcopter-Manager-Play-v0

extra_train_args: ["--headless"]
extra_play_args:  ["--headless"]

sweep_mode: sequential

num_envs: 8192
# skrl train.py converts iterations to timesteps as iterations * rollouts (24).
# 10000 => 240k env steps, enough to reject the 10k-step saturated toy policy.
train_iterations: 10000
eval_steps: 5000

param_grid:
  episode_length_s: [10.0]
