schema_version: 1
track_name: 3D S-Slalom
description: 3D S-shaped slalom where gates alternate left/right AND high/low. Consecutive
  gates are stacked vertically at similar XY but different Z, forcing the drone to
  weave laterally while climbing and descending. Includes approach, the 3D slalom
  section, and a return loop.
elements_tested:
- 3d_slalom
- vertical_stacking
- simple_gate
- 180_turn
gate_size: 0.7
bar_thickness: 0.05
loop_closed: true
